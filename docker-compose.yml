services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nimsocial
      POSTGRES_USER: nimsocial
      POSTGRES_PASSWORD: nimsocial
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimsocial -d nimsocial"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - nimsocial-postgres:/var/lib/postgresql/data

volumes:
  nimsocial-postgres:
